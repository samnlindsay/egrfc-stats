[build-system]
requires = ["setuptools>=45", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "egrfc-stats"
version = "1.0.0"
description = "Rugby club statistics tracking system for East Grinstead RFC"
requires-python = ">=3.8"
dependencies = [
    "gspread",
    "pandas",
    "duckdb",
    "altair",
    "vl-convert-python",
    "beautifulsoup4",
    "requests",
]

[tool.setuptools]
packages = ["python", "python.utils"]

[project.scripts]
sync-headshots = "python.sync_headshots:main"
egrfc-report = "python.reports:main"
